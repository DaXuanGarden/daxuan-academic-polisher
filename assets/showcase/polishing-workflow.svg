<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Daxuan Academic Polisher workflow</title><desc>Source-language academic polishing workflow: detect Chinese or English, load the appropriate register, preserve evidence, and return polished prose with concise notes.</desc><rect width="1600" height="900" fill="#F7FAFC"/><rect x="34" y="28" width="1532" height="844" rx="30" fill="#FFFFFF" stroke="#B8C8D0" stroke-width="2"/><text x="78" y="86" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#39454B">Daxuan Academic Polisher</text><text x="78" y="122" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#8E9DA5">Source language → evidence-preserving editorial pass</text><rect x="1240" y="60" width="260" height="44" rx="22" fill="#E8F0F4" stroke="#B8C8D0" stroke-width="2"/><text x="1370" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#39454B">DEFAULT: SAME LANGUAGE</text><g id="card-1" data-card="1"><rect x="80" y="185" width="240" height="236" rx="24" fill="#E8F0F4" stroke="#5F91AF" stroke-width="3"/><circle cx="116" cy="223" r="18" fill="#5F91AF"/><text x="116" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">1</text><text x="200.0" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#39454B">输入草稿</text><text x="200.0" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#39454B">Input draft</text><path d="M177.0 229 H209.0 L223.0 243 V272 H177.0 Z M209.0 229 V243 H223.0" fill="none" stroke="#5F91AF" stroke-width="3" stroke-linejoin="round"/><path d="M188.0 254 H212.0 M188.0 264 H207.0" stroke="#5F91AF" stroke-width="3" stroke-linecap="round"/></g><g id="card-2" data-card="2"><r