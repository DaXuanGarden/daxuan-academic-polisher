M620 303 H660" fill="none" stroke="#8E9DA5" stroke-width="4" stroke-linecap="round"/><path d="M648 293 L660 303 L648 313" fill="none" stroke="#8E9DA5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M920 303 H960" fill="none" stroke="#8E9DA5" stroke-width="4" stroke-linecap="round"/><path d="M948 293 L960 303 L948 313" fill="none" stroke="#8E9DA5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1220 303 H1260" fill="none" stroke="#8E9DA5" stroke-width="4" stroke-linecap="round"/><path d="M1248 293 L1260 303 L1248 313" fill="none" stroke="#8E9DA5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="480" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#39454B">路由与例外 / Routing and exceptions</text><g><rect x="80" y="514" width="430" height="116" rx="18" fill="#FFFFFF" stroke="#5F91AF" stroke-width="3"/><circle cx="108" cy="544" r="10" fill="#5F91AF"/><text x="130" y="551" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#39454B">中文稿 / Chinese</text><text x="104" y="589" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#39454B">→ references/zh-style.md</text></g><g><rect x="585" y="514" width="430" height="116" rx="18" fill="#FFFFFF" stroke="#5F91AF" stroke-width="3"/><circle cx="613" cy="544" r="10" fill="#5F91AF"/><text x="635" y="551" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#39454B">英文稿 / English</text><text x="609" y="589" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#39454B">→ references/en-style.md</text></g><g><rect x="1090" y="514" width="430" height="116" rx="18" fill="#FFFFFF" stroke="#BB748B" stroke-width="3"/><circle cx="1118" cy="544" r="10" fill="#BB748B"/><text x="1140" y="551" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#39454B">混合或不确定 / Mixed or unclear</text><text x="1114" y="589" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#39454B">→ dominant language; ask when needed</text></g><path d="M800 421 V468 H295 V514" fill="none" stroke="#8E9DA5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M800 468 H800 V514" fill="none" stroke="#8E9DA5" stroke-width="3" stroke-linecap="round"/><path d="M800 468 H1305 V514" fill="none" stroke="#BB748B" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="694" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#39454B">受保护内容 / Protected evidence</text><rect x="80" y="720" width="1440" height="86" rx="18" fill="#E8F0F4" stroke="#B8C8D0" stroke-width="2"/><text x="112" y="773" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#39454B">1,204   ·   p&lt;0.001   ·   [12]   ·   DOI / PMID   ·   Figure 2   ·   rs12345</text><text x="80" y="846" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#8E9DA5">正文先返回；最多五条真正需要核对的说明。无 API key、无自动写回、无隐式文献检索。</text></svg>